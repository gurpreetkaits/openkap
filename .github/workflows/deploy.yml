name: Deploy to Server

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: openkap_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, mbstring, pdo, zip
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer Dependencies
        env:
          COMPOSER_AUTH: ''
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate App Key
        run: php artisan key:generate

      - name: Run Tests
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: openkap_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: |
          php artisan migrate --force
          php artisan test

  deploy:
    runs-on: ubuntu-latest
    needs: test  # Only deploy if tests pass

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to Server
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e  # Exit immediately if a command exits with a non-zero status
            set -o pipefail  # Return value of a pipeline is the status of the last command to exit with a non-zero status

            # Check if git is available and working
            if ! command -v git &> /dev/null; then
              echo "Error: git is not installed"
              exit 1
            fi

            # Check if we have permission to change permissions
            if ! sudo -n true 2>/dev/null; then
              echo "Error: No sudo permission"
              exit 1
            fi

            # Set ownership to deploy user before git reset (storage may be owned by www-data or root)
            sudo chown -R $(whoami):$(id -gn) ${{ secrets.DEPLOY_PATH }} || { echo "Error: Cannot set directory ownership"; exit 1; }
            sudo chmod -R 775 ${{ secrets.DEPLOY_PATH }} || { echo "Error: Cannot set directory permissions"; exit 1; }

            cd ${{ secrets.DEPLOY_PATH }} || { echo "Error: Cannot change to directory"; exit 1; }

            # Fetch latest and force reset to match remote (handles force pushes)
            git fetch origin master || { echo "Error: git fetch failed"; exit 1; }
            git reset --hard origin/master || { echo "Error: git reset failed"; exit 1; }

            # Check if composer is available
            if ! command -v composer &> /dev/null; then
              echo "Error: composer is not installed"
              exit 1
            fi

            # Ensure SQLite database file exists and has correct permissions
            if [ ! -f database/database.sqlite ]; then
              touch database/database.sqlite || { echo "Error: Cannot create database file"; exit 1; }
              chmod 664 database/database.sqlite || { echo "Error: Cannot set database permissions"; exit 1; }
            fi

            # Install PHP dependencies
            composer install --no-dev --optimize-autoloader || { echo "Error: composer install failed"; exit 1; }

            # Run Laravel migrations
            php artisan migrate --force || { echo "Error: Database migration failed"; exit 1; }

            # Clear ALL Laravel caches (config, ROUTE, view, compiled, events) so code
            # changes take effect. A stale bootstrap/cache/routes-*.php would otherwise
            # shadow routes/api.php and hide newly added routes. Then re-cache config.
            php artisan optimize:clear || { echo "Error: optimize:clear failed"; exit 1; }
            php artisan config:cache || { echo "Error: Config cache failed"; exit 1; }

            # Tell any running queue workers to restart so they pick up the new code.
            # No-op if none are running; a supervisor/systemd unit must respawn workers.
            php artisan queue:restart || true

            # Check if npm is available
            if ! command -v npm &> /dev/null; then
              echo "Error: npm is not installed"
              exit 1
            fi

            # Install Node dependencies and build assets
            cd ${{ secrets.DEPLOY_PATH }}/frontend || { echo "Error: Cannot change to frontend directory"; exit 1; }
            npm install || { echo "Error: npm install failed"; exit 1; }
            npm run build || { echo "Error: Frontend build failed"; exit 1; }

            # Check if Apache is running
            if ! systemctl is-active --quiet apache2; then
              echo "Error: Apache is not running"
              exit 1
            fi

            # Ensure Apache (www-data) can write to storage and cache
            sudo chown -R www-data:www-data ${{ secrets.DEPLOY_PATH }}/storage ${{ secrets.DEPLOY_PATH }}/bootstrap/cache
            sudo chmod -R 775 ${{ secrets.DEPLOY_PATH }}/storage ${{ secrets.DEPLOY_PATH }}/bootstrap/cache

            # Restart Apache service
            sudo systemctl restart apache2 || { echo "Error: Apache restart failed"; exit 1; }

            # Reset PHP OPcache so recompiled files are picked up when PHP runs under
            # PHP-FPM (an apache2 restart alone does not recycle FPM workers). Best-effort.
            sudo systemctl restart php8.3-fpm 2>/dev/null \
              || sudo systemctl restart php8.2-fpm 2>/dev/null \
              || sudo systemctl restart php-fpm 2>/dev/null \
              || true

            echo "Deployment completed successfully"
