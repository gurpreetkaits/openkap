; Raise PHP upload limits for the app docroot (honoured by PHP-FPM per-directory).
; Direct video uploads (POST /api/videos, browser extension) would otherwise be
; rejected/reset by PHP defaults (~2M/8M). Cloudflare still caps request bodies
; at 100M on Free/Pro tiers, so very large recordings should use the chunked
; /api/stream/* endpoint (which the main in-app recording flow already does).
upload_max_filesize = 512M
post_max_size = 512M
